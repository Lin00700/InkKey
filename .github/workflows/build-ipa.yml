name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Dictionary self-check
        continue-on-error: true
        run: |
          swiftc -O -o dictionary-check \
            InkKey/Shared/InkDictionary.swift \
            Tools/DictionaryCheck/Stubs.swift \
            Tools/DictionaryCheck/main.swift
          ./dictionary-check Resources/dictionary.json

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project InkKey.xcodeproj \
            -scheme InkKey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Verify bundles and versions
        run: |
          APP="build/Build/Products/Release-iphoneos/InkKey.app"
          APPEX="$APP/PlugIns/InkKeyKeyboard.appex"
          test -d "$APP" || { echo "::error::InkKey.app missing"; exit 1; }
          test -d "$APPEX" || { echo "::error::InkKeyKeyboard.appex missing"; exit 1; }

          for PLIST in "$APP/Info.plist" "$APPEX/Info.plist"; do
            echo "== $PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX/Info.plist" | grep -q "com.apple.keyboard-service"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess" "$APPEX/Info.plist" | grep -qi true
          lipo -info "$APP/InkKey" "$APPEX/InkKeyKeyboard"

      - name: Package IPA
        run: |
          rm -rf Payload InkKey-unsigned.ipa
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/InkKey.app" Payload/
          zip -qry InkKey-unsigned.ipa Payload
          ls -lh InkKey-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: InkKey-unsigned-ipa
          path: InkKey-unsigned.ipa
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: InkKey build ${{ github.run_number }}
          body: |
            未签名 InkKey IPA（iOS 17+，主 App + 九宫格键盘扩展）。
            自签安装后：设置 → 通用 → 键盘 → 键盘 → 添加新键盘 → InkKey，
            再点开 InkKey 打开「允许完全访问」（发音、生词本、字体共享需要）。
          files: InkKey-unsigned.ipa
