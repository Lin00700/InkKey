name: InkKey
options:
  bundleIdPrefix: com.lin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  # ---------------------------------------------------------------- 主 App
  InkKey:
    type: application
    platform: iOS
    sources:
      - path: InkKey
        excludes:
          - "Info.plist"
          - "InkKey.entitlements"
          - "Shared"
      - path: InkKey/Shared
        group: Shared
      - path: Resources
        group: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: InkKey
        PRODUCT_BUNDLE_IDENTIFIER: com.lin.inkkey
        INFOPLIST_FILE: InkKey/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: InkKey/InkKey.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "INKKEY_APP"
    dependencies:
      - target: InkKeyKeyboard
        embed: true
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework

  # ------------------------------------------------------- 键盘扩展 (.appex)
  InkKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: InkKeyKeyboard
        excludes:
          - "Info.plist"
          - "InkKeyKeyboard.entitlements"
      - path: InkKey/Shared
        group: Shared
      - path: Resources
        group: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: InkKeyKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: com.lin.inkkey.keyboard
        INFOPLIST_FILE: InkKeyKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: InkKeyKeyboard/InkKeyKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "INKKEY_KEYBOARD"
    dependencies:
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework

schemes:
  InkKey:
    build:
      targets:
        InkKey: all
        InkKeyKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
